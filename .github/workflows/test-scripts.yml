name: Scripts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install bats
      # Pinned, and from npm rather than the distro packages: the tests use
      # BATS_TEST_TMPDIR (bats >= 1.4) and the apt/brew versions drift per
      # runner image. Too old a bats fails every test inside setup_tmux_stub
      # with a confusing permission error rather than a version error.
      #
      # sudo on Linux only. The ubuntu runner's global npm prefix is /usr/local,
      # which the runner user cannot write to - an unprivileged install dies
      # with EACCES on mkdir of /usr/local/share/man/man7. The macOS runner's
      # prefix is homebrew-owned and already writable, where sudo would instead
      # leave root-owned files in it.
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo npm install -g bats@1.13.0
        else
          npm install -g bats@1.13.0
        fi

    - name: Check bats version
      run: |
        version="$(bats --version | awk '{print $2}')"
        major="${version%%.*}"
        rest="${version#*.}"
        minor="${rest%%.*}"
        if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 4 ]; }; then
          echo "bats ${version} is too old: the tests need BATS_TEST_TMPDIR (bats >= 1.4)"
          exit 1
        fi
        echo "bats ${version}"

    - name: Install shellcheck
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update && sudo apt-get install -y shellcheck
        else
          brew install shellcheck
        fi

    - name: Lint scripts
      working-directory: scripts/scripts
      run: make lint

    - name: Run tests
      working-directory: scripts/scripts
      run: make test
