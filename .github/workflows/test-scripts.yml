name: Scripts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install bats
      # Pinned, and from npm rather than the distro packages: the tests use
      # BATS_TEST_TMPDIR (bats >= 1.4) and the apt/brew versions drift per
      # runner image. Too old a bats fails every test inside setup_tmux_stub
      # with a confusing permission error rather than a version error.
      #
      # sudo on Linux only. The ubuntu runner's global npm prefix is /usr/local,
      # which the runner user cannot write to - an unprivileged install dies
      # with EACCES on mkdir of /usr/local/share/man/man7. The macOS runner's
      # prefix is homebrew-owned and already writable, where sudo would instead
      # leave root-owned files in it.
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo npm install -g bats@1.13.0
        else
          npm install -g bats@1.13.0
        fi

    - name: Check bats version
      run: |
        version="$(bats --version | awk '{print $2}')"
        major="${version%%.*}"
        rest="${version#*.}"
        minor="${rest%%.*}"
        if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 4 ]; }; then
          echo "bats ${version} is too old: the tests need BATS_TEST_TMPDIR (bats >= 1.4)"
          exit 1
        fi
        echo "bats ${version}"

    - name: Install shellcheck
      # Pinned from upstream's own release for the same reason bats is: the
      # distro builds drift per runner image, and here they disagreed on the
      # result. ubuntu 24.04 ships 0.9.0 and brew ships 0.11.0; 0.9.0 reports
      # SC2120 for the `${1:-default}` optional-argument idiom that 0.11.0
      # accepts, so lib/tmux.sh's client_dimensions linted clean on macOS and
      # failed on Linux against the identical tree. An unpinned linter makes
      # a green run a statement about the runner image rather than the code.
      run: |
        version=0.11.0
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)   target=linux.x86_64 ;;
          Linux-aarch64)  target=linux.aarch64 ;;
          Darwin-arm64)   target=darwin.aarch64 ;;
          Darwin-x86_64)  target=darwin.x86_64 ;;
          *) echo "no pinned shellcheck for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        dir="$(mktemp -d)"
        curl -sSLf "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.${target}.tar.xz" \
          | tar -xJ -C "${dir}"
        mkdir -p "${HOME}/.local/bin"
        mv "${dir}/shellcheck-v${version}/shellcheck" "${HOME}/.local/bin/shellcheck"
        rm -rf "${dir}"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Check shellcheck version
      run: |
        shellcheck --version
        version="$(shellcheck --version | awk '/^version:/ {print $2}')"
        if [ "${version}" != "0.11.0" ]; then
          echo "expected the pinned shellcheck 0.11.0, got ${version}"
          exit 1
        fi

    - name: Lint scripts
      working-directory: scripts/scripts
      run: make lint

    - name: Run tests
      working-directory: scripts/scripts
      run: make test
